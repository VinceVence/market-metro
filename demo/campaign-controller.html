<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Market Metro · Campaign decisions</title>
  <link rel="stylesheet" href="/garden/style.css"><link rel="stylesheet" href="/garden/policy-lab.css">
  <style>
    body{background:#dce6df}.policy-lab{inset:0;margin:auto}.pl-header a{color:#2c6673;font-size:13px;text-decoration:none}
    #campaign-controller{padding-top:18px}#campaign-controller .plb-title h3{font-size:23px}#campaign-controller .plb-reading{padding:13px 0;margin:12px 0}#campaign-controller .plb-nav{margin:15px 0}#campaign-controller .plb-case-label{margin:10px 0!important}#cc-case{width:min(470px,100%)}#campaign-controller .rl-office{margin:13px 0;max-width:590px}#campaign-controller .pl-agent svg{height:66px}#campaign-controller .rl-playback{margin:15px 0}#campaign-controller .pl-agent b{min-height:23px}#campaign-controller .pl-table-wrap th,#campaign-controller .pl-table-wrap td{color:var(--pl-ink)}@media(max-width:600px){.pl-header>div{flex-basis:100%}#campaign-controller .plb-title h3{font-size:21px}.cc-links{width:100%;justify-content:space-between}}
    .cc-evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.cc-evidence>div{padding:11px;background:#edf3ef;border-radius:7px;min-width:0}.cc-evidence b,.cc-evidence small{display:block}.cc-evidence b{font-size:20px}.cc-evidence small{font-size:11px;line-height:1.5;color:var(--pl-muted)}.cc-links{display:flex;gap:14px;flex-wrap:wrap}.cc-cost{font-variant-numeric:tabular-nums}.cc-outcome{font-size:25px!important;font-weight:700}.cc-negative{color:#934734!important}.cc-positive{color:#2a654f!important}.cc-case-meta{margin:13px 0!important}.cc-table-note{padding:12px!important}.cc-planes{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:17px 0;font-size:12px}.cc-planes span{border:1px solid var(--pl-line);padding:8px;border-radius:5px;background:#fff}.cc-planes i{font-style:normal}.cc-explain{max-width:850px}.cc-explain li{line-height:1.6;font-size:14px;margin:12px 0}@media(max-width:600px){.cc-evidence{grid-template-columns:1fr 1fr}.pl-header{flex-wrap:wrap}.cc-links{font-size:11px}}
  </style>
</head>
<body>
  <dialog class="policy-lab" open aria-label="Campaign controller evidence"><div class="pl-shell">
    <header class="pl-header"><div><small>MARKET METRO · POLICY LAB</small><h2>Campaign decisions</h2></div><nav class="cc-links"><a href="/mesh.html">Run agent team ↗</a><a href="/trusted.html">Trusted workflow</a><a href="/">Open the market ↗</a></nav></header>
    <main class="pl-benchmarks" id="campaign-controller" aria-live="polite"><p>Loading recorded decisions…</p></main>
  </div></dialog>
  <script type="module">import {mountCampaignController} from '/garden/campaign-controller-view.mjs';mountCampaignController(document.querySelector('#campaign-controller'));</script>
</body>
</html>
