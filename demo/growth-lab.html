<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Metro · Experiment lab</title><link rel="stylesheet" href="/garden/style.css"><link rel="stylesheet" href="/garden/policy-lab.css">
<style>
body{margin:0;background:#e8eee7;color:#24424d;font-family:'DM Sans',sans-serif;overflow:auto}main{max-width:1150px;margin:auto;padding:24px}header{background:none;color:#24424d;padding:0;border:0;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;margin:8px 0;color:#24424d}h2{font-size:22px}a{color:#2c6673}small,.muted{color:#526e79}p{line-height:1.55}.status{background:#fff5e5;border-left:4px solid #b8833e;padding:18px 22px;margin:22px 0}.status b{font-size:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metrics article{background:white;border:1px solid #ccd9d0;border-radius:10px;padding:16px}.metrics b{display:block;font-size:26px;margin:7px 0}.metrics small{display:block}nav{display:flex;gap:10px;margin:22px 0}button[aria-selected=true]{background:#2c6673;color:white}nav button{padding:12px 18px}.figure{margin:20px 0;background:white;border:1px solid #ccd9d0;border-radius:12px;padding:12px}.figure img{width:100%;height:auto}.figure a{font-size:12px}select{font:inherit;padding:10px;border:1px solid #b9cbc2;border-radius:8px;background:white;color:#24424d;max-width:100%}.case-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.case-head p{font-size:13px}.office{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.office .pl-agent{background:#f6f8f3;min-height:130px;border:2px solid transparent}.office .pl-agent.active{border-color:#2c6673;background:white}.office svg{height:75px}.office small,.office b{text-align:center}.step{padding:22px;background:#fff;border:1px solid #ccd9d0;border-radius:12px;min-height:250px}.step h2{margin:6px 0 12px}.step p{font-size:15px}.tag{display:inline-block;font-size:11px;padding:5px 9px;background:#e5eee6;border-radius:5px;color:#2c6673;font-weight:700}.numbers{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0}.numbers b{display:block;font-size:24px}.numbers small{display:block}.controls{display:flex;align-items:center;gap:10px;margin:16px 0}.controls button{padding:11px 18px}.controls span{margin-left:auto;color:#526e79;font-size:12px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.steps button{font-size:11px;padding:10px}.step details,details.note{font-size:12px;margin-top:15px;color:#526e79}.step pre{max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 ui-monospace,monospace}.note{background:#f5f8f2;padding:16px;border-radius:8px;line-height:1.6}.table-wrap{overflow:auto;background:white;border:1px solid #ccd9d0;border-radius:10px;margin:16px 0}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{padding:12px;text-align:right;border-bottom:1px solid #e0e6e0}td:first-child,th:first-child{text-align:left}th{background:#e0ebe3}footer{font-size:12px;line-height:1.6;margin-top:25px}section[hidden]{display:none}
@media(max-width:720px){main{padding:15px}h1{font-size:23px}header{display:block}.metrics{grid-template-columns:1fr 1fr}.metrics article{padding:12px}.case-head{display:block}.office{gap:6px}.office .pl-agent{min-height:105px;padding:6px}.office svg{height:50px}.office b{font-size:12px}.office small{font-size:10px}.steps{grid-template-columns:repeat(3,1fr)}.controls button{padding:10px}.step{padding:16px}.status{padding:15px}}
</style></head><body><main><header><div><small>MARKET METRO · GENERALIZATION CHECK</small><h1>A team that tests its own campaign ideas.</h1></div><a href="/campaign-improvements.html">Latest targeting & harness results ↗</a></header><p style="padding:14px;background:#fff6e5;border-left:4px solid #b78338"><b>New result:</b> targeted recovery reduced loss73% versus broad outreach, but remains below no campaign. <a href="/campaign-improvements.html">See the fresh60-market check and release gate ↗</a></p><div id="content" role="status">Loading saved experiments…</div></main>
<script type="module">
import {worker} from '/garden/office-scene.mjs';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n),signed=n=>(n<0?'−':'+')+money(Math.abs(n));
const scenario={steady:'Steady demand',rival_sale:'Rival sale',budget_squeeze:'Household budget pressure',supply_delay:'Stock disruption',returns_wave:'Delayed returns'};
const family={reward:'Reward regression',eligible:'Eligibility-aware regression',incremental:'Incremental-effect learner'};
const r=await(await fetch('/data/growth-lab.json',{cache:'no-store'})).json(),root=document.querySelector('#content');root.removeAttribute('role');
let index=0,step=0,timer=null,tab='workflow';
const agent=r.agentSummary[0].platform,matched=r.matchedSummary.find(x=>x.method==='numeric-selector').platform;
root.innerHTML=`<div class="status"><b>The workflow improved. Large growth is not demonstrated.</b><p>The team completed 10/10 fresh cases and tested another learning family in every case. Average modeled platform value was ${signed(agent.mean)} versus no campaign, compared with ${signed(matched.mean)} for the numerical selector on those same cases. This version has not been promoted to the live default.</p></div><div class="metrics">${[['40','Held-out numerical markets'],['5','Market scenarios'],['10 / 10','Fresh agent cases completed'],['$'+r.cost.usd.toFixed(3),'New model usage estimate']].map(([v,k])=>`<article><b>${v}</b><small>${k}</small></article>`).join('')}</div><nav><button data-tab="workflow" aria-selected="true">Watch the team</button><button data-tab="results" aria-selected="false">Research results</button></nav><section id="workflow"><div class="case-head"><div><h2>One complete experiment</h2><p>Recorded model decisions. Playback makes no calls.</p></div><select id="case-picker" aria-label="Market case">${r.cases.map((c,i)=>`<option value="${i}">${i+1}. ${scenario[c.scenario]} · seed${c.seed}</option>`).join('')}</select></div><div id="evidence" class="note"></div><div class="office" id="office">${[['Scientist','Gemini proposes','#cda45c'],['Learning worker','Local CPU experiments','#8a7fa9'],['Reviewer','Gemini challenges','#619b8c']].map(([name,duty,color],i)=>`<div class="pl-agent" data-role="${i}">${worker(color,i)}<b>${name}</b><small>${duty}</small></div>`).join('')}</div><article class="step" id="step"></article><div class="controls"><button id="back">← Back</button><button id="play" class="primary">▶ Play recorded run</button><button id="next">Next →</button><span id="position"></span></div><div id="steps" class="steps"></div></section><section id="results" hidden><h2>What generalized—and what did not</h2><p>Numerical methods: 40 test markets across 8 seeds. Fresh agents: 10 of those markets across 2 seeds. These are separate evaluations.</p><div class="figure"><img src="/figures/agent-generalization/targeting-methods.svg" alt="Model comparison: none of the six numerical recipes established positive platform growth"><a href="/figures/agent-generalization/targeting-methods.pdf">Open research figure ↗</a></div><div class="figure"><img src="/figures/agent-generalization/agent-comparison.svg" alt="Agent and numerical controls on ten matched cases; the agent still loses to no campaign"></div><h2>All agent cases</h2><div class="table-wrap"><table><thead><tr><th>Market</th><th>Seed</th><th>Platform Δ</th><th>Merchant Δ</th><th>Coupons</th><th>Redeemed</th></tr></thead><tbody>${r.cases.map(c=>`<tr><td>${scenario[c.scenario]}</td><td>${c.seed}</td><td>${signed(c.score.deltaUSD)}</td><td>${signed(c.score.merchantDeltaUSD)}</td><td>${c.score.offers}</td><td>${c.score.redemptions}</td></tr>`).join('')}</tbody></table></div><div class="figure"><img src="/figures/agent-generalization/external-check.svg" alt="Independent email-data targeting estimate has an uncertainty interval crossing zero"></div><details class="note"><summary>Evaluation boundaries</summary><p>${esc(r.disclosure)}</p><p>Every fresh case received at most two development probes, each using three separate seeds. Probe values were allowed feedback; final test results were hidden until commitment. The published test sets were not changed after seeing outcomes.</p><p>Only two independent fresh-agent seed clusters: no inferential confidence band is displayed for that panel. The numerical panel has eight seed clusters. The external dataset is a historical email experiment, not PayPal customer data.</p><p>Ten initial requests were rejected for a schema-format error at zero model cost. They are preserved separately. All ten repaired workflows completed, using 30 generated model decisions.</p></details></section><footer><b>Channel3:</b> cached real product listings; simulated stock, shoppers and responses.<br><b>PayPal:</b> frozen modeled fee/cost accounting and the existing separate Sandbox receipt integration. No payment was issued by this study.<br>New model usage: $${r.cost.usd.toFixed(6)} · lifetime recorded estimate: $${r.cost.lifetimeUSD.toFixed(6)} · local CPU is unpriced.</footer>`;
function frames(c){return [...c.trace.map(t=>({t,role:t.role==='Local experiment worker'?1:t.role==='Independent economic reviewer'?2:0})),{role:null,outcome:true}];}
function show(){
 const c=r.cases[index],f=frames(c),x=f[step];document.querySelector('#evidence').innerHTML=`<b>What the team knew · day 45</b><p>${c.evidence.recentPurchases} purchases in the latest week versus ${c.evidence.previousPurchases} before it; ${Math.round(c.evidence.lapsedFraction*100)}% of shoppers were lapsed. All training labels were mature at the cutoff.</p>`;
 document.querySelectorAll('[data-role]').forEach(e=>e.classList.toggle('active',Number(e.dataset.role)===x.role));
 let title,body,record=x.t;
 if(x.outcome){title='The final market disagrees with the pilot—or confirms it.';body=`<span class="tag">Independent test outcome · through day 114</span><div class="numbers"><div><b>${signed(c.score.deltaUSD)}</b><small>Platform vs no campaign</small></div><div><b>${signed(c.score.merchantDeltaUSD)}</b><small>Merchant contribution</small></div></div><p>${c.authorizedCandidate?'Tested candidate '+c.authorizedCandidate+' was released for a bounded experiment.':'The harness kept outreach off.'} Customers continued shopping.</p><p>${c.score.offers} coupons · ${c.score.redemptions} redemptions · ${c.score.recommendations} recommendations. An optimistic development probe is not proof of generalization.</p>`;record={authorizedCandidate:c.authorizedCandidate,outcome:c.score,shopperTraceSample:c.shopperTrace.slice(0,12)};}
 else if(x.t.role==='Local experiment worker'){const a=x.t.artifact,p=a.probe;title='Train and test candidate '+x.t.candidate;body=`<span class="tag">Local CPU · ${family[a.family]}</span><p>${a.trainingScope.rows.toLocaleString()} mature randomized training rows from ${a.trainingScope.customers} customers across prior and current histories.</p><div class="numbers"><div><b>${signed(p.platform.mean)}</b><small>Mean platform change in 3 probe markets</small></div><div><b>${signed(p.merchant.mean)}</b><small>Mean merchant change in those probes</small></div></div><p>Worst probe: ${signed(p.platform.worst)}. ${p.launchable?'Eligible for a small experiment, subject to model cost.':'Does not pass the release screen.'} These are development probes, not the final test.</p>`;}
 else {const a=x.t.response.args;title=x.t.role==='Independent economic reviewer'?'Challenge the first idea':a.spec?'Form a business hypothesis':'Choose from the tested alternatives';body=`<span class="tag">Actual ${esc(x.t.provider?.modelVersion||'Gemini')} decision</span>${a.hypothesis?'<p><b>'+esc(a.hypothesis)+'</b></p>':''}<p>${esc(a.rationale)}</p>`;const s=a.spec||(a.decision==='revise'?a.revision:null);if(s)body+=`<p><b>${family[s.family]}</b> · ${s.audience} shoppers · ${s.maxOfferPct}% maximum discount · ${s.durationDays} days.</p>`;if(a.decision)body+=`<p><b>Reviewer: ${esc(a.decision)}</b></p>`;if(a.candidate)body+=`<p><b>Selected: ${esc(a.candidate)}</b> · cited probe mean ${signed(a.expectedMeanUSD)}</p>`;}
 document.querySelector('#step').innerHTML=`<h2>${title}</h2>${body}<details><summary>Recorded decision, model or outcome</summary><pre>${esc(JSON.stringify(record,null,2))}</pre></details>`;
 document.querySelector('#position').textContent=`${step+1} / ${f.length}`;document.querySelector('#back').disabled=step===0;document.querySelector('#next').disabled=step===f.length-1;
 document.querySelector('#steps').innerHTML=f.map((q,i)=>`<button data-step="${i}" aria-selected="${i===step}">${q.outcome?'Final outcome':q.t.role==='Local experiment worker'?'Test '+q.t.candidate:q.t.role==='Independent economic reviewer'?'Review':q.t.response.args.spec?'Propose':'Commit'}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{stop();step=Number(b.dataset.step);show();});
}
function stop(){clearInterval(timer);timer=null;document.querySelector('#play').textContent='▶ Play recorded run';}
document.querySelector('#case-picker').onchange=e=>{stop();index=Number(e.target.value);step=0;show();};
document.querySelector('#back').onclick=()=>{stop();step=Math.max(0,step-1);show();};document.querySelector('#next').onclick=()=>{stop();step=Math.min(frames(r.cases[index]).length-1,step+1);show();};
document.querySelector('#play').onclick=()=>{if(timer){stop();return;}if(step===frames(r.cases[index]).length-1)step=0;show();document.querySelector('#play').textContent='Ⅱ Pause';timer=setInterval(()=>{if(step>=frames(r.cases[index]).length-1){stop();return;}step++;show();},4000);};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stop();tab=b.dataset.tab;for(const id of ['workflow','results'])document.querySelector('#'+id).hidden=id!==tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===tab)));});show();
</script></body></html>
