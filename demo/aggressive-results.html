</style></head><body><main><header><div><small>MARKET METRO · INDEPENDENT POLICY EVALUATION</small><h1>The longer check reversed the gain.</h1></div><a class="cta" href="/aggressive-demo.html">Watch the campaign ↗</a></header><div id="content" role="status">Loading audited results…</div></main><script type="module">
const r=await(await fetch('/data/aggressive-results.json',{cache:'no-store'})).json(),usd=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x),sign=x=>(x<0?'−':'+')+usd(Math.abs(x));
const names={'organic':'No campaign','broad-full-price':'Broad full-price outreach','high-value':'High-value products','high-value-loyal':'High value + familiar merchant','high-value-weekly':'High value + weekly timing','return-aware':'Return-aware broad outreach','high-value-return-aware':'High value + return routing','high-value-weekly-return-aware':'Selected numerical program'};
const root=document.querySelector('#content');root.removeAttribute('role');root.innerHTML=`<section class="banner"><p><b>Durability check failed:</b> after outreach stopped at day100, ordinary shopping through day200 reduced mean platform value to −$5.33. The figures below describe the shorter100-day window.</p><b>${sign(r.stats.platform.mean)} modeled platform contribution per100 shoppers.</b><p>95% interval: ${sign(r.stats.platform.low)} to ${sign(r.stats.platform.high)} after a conservative model-cost allowance. Selected on20 development markets, then evaluated on80 fresh markets. Economic equations stayed fixed.</p></section><div class="metrics">${[[sign(r.stats.platform.mean),'Mean platform gain'],[sign(r.stats.merchant.mean),'Mean merchant contribution'],[sign(r.stats.volume.mean),'Additional retained volume'],[Math.round(r.stats.platform.winRate*80)+'/80','Markets with platform gains']].map(([v,k])=>`<article><b>${v}</b><small>${k}</small></article>`).join('')}</div><p><a href="/campaign-improvements.html">Latest targeting and durable-release checks ↗</a></p><h2>The archived campaign</h2><p>Recommend higher-value products at full price, favor a familiar merchant, run in the first two days of each virtual week, and exclude merchants with elevated observed mature-return risk. The program can operate throughout days30–99 under a$50 virtual budget. All competing policies received the same authority.</p><div class="figure"><img src="/figures/aggressive-policy/financial-bridge.svg" alt="Extra retained margin15.56 less10.09 outreach and0.04 inference leaves5.43 modeled platform gain"><a href="/figures/aggressive-policy/financial-bridge.pdf">Open financial figure ↗</a></div><div class="figure"><img src="/figures/aggressive-policy/policy-confirmation.svg" alt="Policy confirmation across80 fresh markets with uncertainty intervals"><a href="/figures/aggressive-policy/policy-confirmation.pdf">Open full comparison ↗</a></div><h2>All tested policies</h2><div class="table-wrap"><table><thead><tr><th>Policy</th><th>Platform Δ before inference</th><th>Merchant Δ</th><th>Platform win rate</th></tr></thead><tbody>${r.allPolicies.map(s=>`<tr><td>${names[s.policy]}</td><td>${sign(s.platform.mean)}</td><td>${sign(s.merchant.mean)}</td><td>${Math.round(s.platform.winRate*100)}%</td></tr>`).join('')}</tbody></table></div><details><summary>What the agents did—and what this does not prove</summary><p>Three fresh strategist/reviewer trials independently selected the same tested policy from development evidence, before independent test results were opened. Code executes the approved schedule, targeting and limits. This is six generated model decisions, not80 fresh agent conversations.</p><p>The policy designs are transparent numerical programs. The same selected program without LLM selection achieves the same commerce outcome at lower inference cost. This does not prove that an LLM beats a numerical optimizer.</p><p>Mean platform growth is${r.stats.growth.mean.toFixed(2)}%, not10%. Worst case:${sign(r.stats.platform.worst)}. Some markets still lose. Results are conditional on this synthetic economy and five equally weighted scenarios.</p><p>${r.boundary}</p></details><footer>New model usage estimate:$${r.newModelUSD.toFixed(6)} · cumulative recorded estimate:$${r.lifetimeRecordedUSD.toFixed(6)}. Not a billing invoice.<br>No new native PayPal payments. The demo writes simulated orders and transactions to the warehouse and shows the existing Sandbox receipt separately.<br><a href="/growth-lab.html">Previous negative study, retained in full ↗</a></footer>`;
</script></body></html>
