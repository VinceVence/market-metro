<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Metro · Campaign improvement</title><link rel="stylesheet" href="/garden/style.css"><link rel="stylesheet" href="/garden/policy-lab.css">
<style>
body{margin:0;background:#e8eee7;color:#24424d;font-family:'DM Sans',sans-serif;overflow:auto}main{max-width:1120px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;background:none;border:0;color:inherit;padding:0}h1{font-size:30px;letter-spacing:-.7px;margin:8px 0}h2{font-size:22px;margin:0 0 14px}p{line-height:1.6}a{color:#2c6673}small,.muted{color:#526e79}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px}.verdict{border-left:4px solid #b78338;background:#fff6e5;padding:17px 22px;margin:22px 0}.verdict b{font-size:19px}.verdict p{margin-bottom:0;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metrics article{background:white;border:1px solid #ccd9d0;border-radius:10px;padding:18px}.metrics b{font-size:29px;display:block;margin:8px 0}.metrics small{font-size:12px}.metrics span{font-size:12px;font-weight:700}.metrics .good b{color:#26705b}nav{display:flex;gap:8px;margin:22px 0}nav button{padding:12px 18px}button[aria-selected=true]{background:#2c6673;color:white}.office{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.office .pl-agent{min-height:144px;background:#f4f7f0;border:2px solid transparent}.office .pl-agent.active{border-color:#2c6673;background:white}.office svg{height:72px}.office small,.office b{text-align:center}.explain{padding:22px;background:white;border:1px solid #ccd9d0;border-radius:12px;min-height:215px}.explain b{color:#214653}.pill{background:#e8eee1;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:12px}.controls{display:flex;gap:10px;align-items:center;margin:16px 0}.controls button{padding:11px 18px}.controls small{margin-left:auto}.figure{background:white;border:1px solid #ccd9d0;border-radius:12px;padding:10px;margin:18px 0}.figure img{width:100%;height:auto}.bridge{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.bridge article{background:white;padding:20px;border:1px solid #ccd9d0;border-radius:10px}.bridge h3{font-size:16px;margin:0 0 12px}.bridge dl{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px;margin:0}.bridge dt,.bridge dd{margin:0}.bridge dd{text-align:right;font-variant-numeric:tabular-nums}.bridge .total{border-top:1px solid #d5e1d8;padding-top:10px;font-weight:700}details{font-size:13px;border-top:1px solid #c9d7ce;padding:16px 0;line-height:1.6}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 ui-monospace,monospace;max-height:250px;overflow:auto}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{text-align:right;padding:10px;border-bottom:1px solid #d5e0d7}td:first-child,th:first-child{text-align:left}footer{margin-top:20px;border-top:1px solid #c5d4ca;padding-top:16px;font-size:12px;line-height:1.7;color:#526e79}section[hidden]{display:none}.sources{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
@media(max-width:700px){main{padding:16px}header{display:block}h1{font-size:25px}header a{font-size:12px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metrics article{padding:12px}.metrics b{font-size:25px}.office{gap:7px}.office .pl-agent{min-height:110px;padding:6px}.office svg{height:50px}.office b{font-size:12px}.office small{font-size:10px}.bridge{grid-template-columns:1fr}.explain{padding:17px}.explain p{font-size:14px}.controls small{display:none}}
</style></head><body><main><header><div><span class="eyebrow">MARKET METRO · FRESH CONFIRMATION</span><h1>Archived V1 targeting result</h1></div><a href="/behavior-lab.html">Open the corrected V3 market ↗</a></header><div id="app" role="status">Loading the independent results…</div></main>
<script type="module">
import {worker} from '/garden/office-scene.mjs';
const r=await(await fetch('/data/campaign-improvements.json',{cache:'no-store'})).json();
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n),signed=n=>(n<0?'−':'+')+money(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const [organic,broad,targeted]=r.policies;
$('app').removeAttribute('role');
$('app').innerHTML=`<div class="verdict"><b>${r.lossReductionPct.toFixed(0)}% less loss than broad recovery outreach. Still below no campaign.</b><p>The narrower campaign was tested on <b>60 fresh markets across 12 seeds and five scenarios</b>, through 400 shopping days. The harness blocks scaling because sustained platform gain and merchant benefit did not pass.</p></div>
<div class="metrics">${[[signed(broad.platform.mean),'Broad recovery outreach','vs no campaign'],[signed(targeted.platform.mean),'Targeted recovery outreach','including $0.10 model allowance'],[signed(r.stats.vsBroad.mean),'Improvement vs broad','95% CI '+signed(r.stats.vsBroad.low)+' to '+signed(r.stats.vsBroad.high),'good'],['BLOCKED','Scale-up decision','Shopping can continue']].map(([v,k,s,c])=>`<article class="${c||''}"><span>${k}</span><b>${v}</b><small>${s}</small></article>`).join('')}</div>
<nav><button data-tab="workflow" aria-selected="true">What changed</button><button data-tab="results" aria-selected="false">Fresh results & graphs</button></nav>
<section id="workflow"><div class="office">${[['Planner','This chat · candidate design','#cda45c'],['Evaluator','Local code · paired markets','#8a7fa9'],['Release gate','Code · blocks unsupported scale','#619b8c']].map(([n,d,c],i)=>`<div class="pl-agent" data-role="${i}">${worker(c,i)}<b>${n}</b><small>${d}</small></div>`).join('')}</div><article class="explain" id="step"></article><div class="controls"><button id="back">← Back</button><button id="play" class="primary">▶ Walk through the fix</button><button id="next">Next →</button><small id="position"></small></div><details><summary>What was actually changed?</summary><p>Added an observed-customer eligibility condition: the shopper previously bought from a merchant with elevated mature returns and has not bought for at least 7 days. Route recommendations to safer merchants. All policies keep the same stock, margin and contact constraints. No discount subsidies.</p><p>Both candidate and broad control can act on days 30–199 with a $50 virtual budget. Shopping continues through day 400, followed by the refund tail. The original behavioral and fee equations are unchanged. The earlier70-day campaign experiment is a separate study.</p><p>${esc(r.provenance)}</p></details></section>
<section id="results" hidden><div class="figure"><img src="/figures/focused-recovery/confirmation.svg" alt="Targeted campaign improves against broad outreach but remains below no campaign after400 days"><a href="/figures/focused-recovery/confirmation.pdf">Download research figure ↗</a></div><h2>Why more outreach lost money</h2><p>Extra retained payment margin did not cover contact costs. These are averages per100 simulated shoppers.</p><div class="bridge">${[broad,targeted].map((p,i)=>`<article><h3>${i?'Targeted campaign':'Broad campaign'}</h3><dl><dt>Extra margin after processing & returns</dt><dd>${signed(p.bridge.extraMarginUSD)}</dd><dt>Outreach</dt><dd>−${money(p.bridge.outreachUSD)}</dd><dt>Model allowance</dt><dd>−${money(p.bridge.modelAllowanceUSD)}</dd><dt class="total">Net vs no campaign</dt><dd class="total">${signed(p.bridge.netUSD)}</dd></dl><p class="muted">${p.meanRecommendations.toFixed(1)} recommendations per market on average.</p></article>`).join('')}</div>
<p>Targeted merchant contribution: <b>${signed(r.stats.merchant.mean)}</b> (95% CI ${signed(r.stats.merchant.low)} to ${signed(r.stats.merchant.high)}). Platform wins in ${Math.round(r.stats.platform.winRate*60)}/60 markets. A lower average loss is useful progress; it is not positive growth.</p>
<details><summary>All 60 results, including losses</summary><div class="scroll"><table><thead><tr><th>Scenario</th><th>Seed</th><th>Platform vs none</th><th>vs broad</th><th>Merchant</th><th>Contacts</th></tr></thead><tbody>${r.cases.map(x=>`<tr><td>${esc(x.scenario)}</td><td>${x.seed}</td><td>${signed(x.afterCostUSD)}</td><td>${signed(x.vsBroadUSD)}</td><td>${signed(x.merchantDeltaUSD)}</td><td>${x.recommendations}</td></tr>`).join('')}</tbody></table></div></details>
<details><summary>Why the earlier positive chart was insufficient</summary><p>The earlier recurring program showed ${signed(r.oldShortWindow.days100)} at 100 days, but ${signed(r.oldShortWindow.days200)} at 200 days after outreach stopped. This is a different policy and experiment. Its results remain available; they are not replaced by this study.</p><a href="/aggressive-results.html">Read the earlier durability failure ↗</a></details><details><summary>Evaluation contract and release decision</summary><p>${esc(r.comparison)}</p><p>The exploratory candidate was fixed before these 60 fresh markets. The original development confidence gate chose no campaign. This separate confirmation tested the best mean candidate anyway; it also failed.</p><pre>${esc(JSON.stringify({proof:r.proof,gate:r.gate},null,2))}</pre><div class="sources"><a href="${r.sources.contract}">Frozen validation protocol</a><a href="${r.sources.raw}">Full validation data</a></div></details></section>
<footer><b>Channel3:</b> cached real product listings. <b>PayPal:</b> modeled retained fees and costs; existing Sandbox integration remains separate. No new payments.<br>${esc(r.assumptions)}<br>Focused validation: $0 new model spend. Earlier approvals this iteration: $${r.cost.iterationModelUSD.toFixed(3)}. Recorded project model usage: $${r.cost.lifetimeUSD.toFixed(3)}. Local CPU unpriced; provider-bill settlement may differ.<div class="sources"><a href="/growth-lab.html">Previous growth study</a><a href="/model-comparison.html">Model comparison</a><a href="/mesh.html">Agent team & warehouse</a></div></footer>`;
const steps=[
 {role:0,tag:'Diagnosis',title:'More purchases were not enough.',body:`The broad campaign added only ${money(broad.bridge.extraMarginUSD)} of retained payment margin but cost ${money(broad.bridge.outreachUSD)} to deliver. Increasing contact volume would spend more before establishing an incremental benefit.`},
 {role:0,tag:'Candidate chosen here · no fresh Gemini call',title:'Contact people with a relevant problem.',body:'The candidate targets a lapsed shopper whose last observed merchant has elevated returns. It recommends a safer retailer. A shopper already buying normally, or not exposed to that merchant, is left alone. Prices come from the cached Channel3 catalog.'},
 {role:1,tag:'60 independent paired markets · no new tuning',title:'Keep the market running after the campaign.',body:'The same seeds and shocks drive targeted, broad and no-campaign worlds. Outreach stops after day 200. Shopping continues for another 200 days, and all refunds mature. The evaluator counts fees, processing, contact costs and a conservative inference allowance.'},
 {role:2,tag:'Trusted release gate · BLOCKED',title:'Keep shopping. Do not scale this campaign.',body:`The targeted policy improved by ${signed(r.stats.vsBroad.mean)} versus broad outreach, but its net result was ${signed(r.stats.platform.mean)} versus no campaign. The app now rejects a profitable-rollout conclusion from one short market, even if its raw fees look higher.`}
];let step=0,timer=null;
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Walk through the fix';}
function render(){const s=steps[step];$('step').innerHTML=`<span class="pill">${s.tag}</span><h2>${s.title}</h2><p>${s.body}</p>`;document.querySelectorAll('[data-role]').forEach(e=>e.classList.toggle('active',+e.dataset.role===s.role));$('back').disabled=!step;$('next').disabled=step===3;$('position').textContent=`${step+1} / 4 · saved evidence; no paid calls`;}
$('back').onclick=()=>{stop();step--;render();};$('next').onclick=()=>{stop();step++;render();};$('play').onclick=()=>{if(timer)return stop();if(step===3)step=0;render();$('play').textContent='Ⅱ Pause';timer=setInterval(()=>{if(step===3)return stop();step++;render();},5500);};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stop();for(const id of ['workflow','results'])$(id).hidden=id!==b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));});render();
</script></body></html>
