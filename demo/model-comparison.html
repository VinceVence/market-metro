<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Metro · Campaign model comparison</title><link rel="stylesheet" href="/garden/style.css">
<style>
body{margin:0;overflow:auto;background:#e8eee7;color:#24424d;font-family:'DM Sans',sans-serif}main{max-width:1150px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;background:transparent;color:#24424d;padding:0;border:0}header h1{color:#24424d}header small,header a{color:#2c6673}h1{font-size:28px;margin:8px 0}h2{font-size:21px}p{line-height:1.55}a{color:#2c6673}small,.muted{color:#526e79}.summary{padding:18px 22px;border-left:4px solid #b57c40;background:#fff8e9;margin:22px 0}.summary strong{display:block;font-size:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#fff;border:1px solid #cfdbd2;padding:16px;border-radius:10px}.metric b{display:block;font-size:25px;margin:9px 0}.metric small{display:block}nav{display:flex;gap:9px;align-items:center;margin:22px 0}nav button{padding:12px 20px}nav button[aria-selected=true]{background:#2c6673;color:white}.evidence{padding:14px 18px;background:#f6f8f3;border:1px solid #ccd9d0;border-radius:10px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.team{background:#fff;border:1px solid #cfdbd2;border-radius:12px;padding:22px}.team h2{margin-top:0}.role{padding:15px 0;border-top:1px solid #dce5de}.role b{display:block}.role p{font-size:14px;margin:8px 0}.choice{font-size:20px;font-weight:700;margin:10px 0}.status{display:inline-block;border-radius:6px;padding:6px 10px;background:#e4eee6;color:#315c44;font-size:12px;font-weight:700}.status.reject{background:#fff0d8;color:#7d562b}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#5e786f;font-size:13px;margin:18px 0}.flow span{background:#f7faf5;border:1px solid #cedbd0;padding:8px 12px;border-radius:7px}.results{overflow:auto;background:#fff;border:1px solid #cfdbd2;border-radius:12px;margin-top:20px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:14px;text-align:right;border-bottom:1px solid #e0e6e0}th:first-child,td:first-child{text-align:left}th{background:#e0ebe3}details{background:#f4f7f1;padding:16px;border-radius:9px;margin:18px 0;font-size:13px}summary{cursor:pointer;font-weight:700}footer{font-size:12px;line-height:1.7;margin-top:20px}.source{font-size:12px}.loading{padding:20px}.no-wrap{white-space:nowrap}
@media(max-width:740px){main{padding:16px}h1{font-size:23px}header{align-items:flex-start}header a{font-size:12px}.teams{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric b{font-size:22px}.team{padding:17px}.summary{padding:15px}.summary strong{font-size:18px}}
</style></head><body><main><header><div><small>MARKET METRO · SAME EVIDENCE, DIFFERENT MODELS</small><h1>Does a stronger campaign team help?</h1></div><a href="/growth-lab.html">New generalization study ↗</a></header><div id="content" class="loading" role="status">Loading recorded model decisions…</div></main>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n),signed=n=>(n<0?'−':'+')+usd(Math.abs(n));
const labels={lite:'Flash-Lite team',hybrid:'Pro planning + review',rules_harness:'Rules + same harness',recommend_all:'Full-price recommendations · all',recommend_lapsed:'Full-price recommendations · lapsed',organic:'No campaign'};
try{
 const r=await(await fetch('/data/model-comparison.json',{cache:'no-store'})).json();if(r.status!=='COMPLETE')throw Error('Comparison has not completed.');
 const lite=r.rows.find(x=>x.method==='lite'),pro=r.rows.find(x=>x.method==='hybrid'),rules=r.rows.find(x=>x.method==='rules_harness');
 const root=document.querySelector('#content');root.className='';root.removeAttribute('role');
 root.innerHTML=`<section class="summary"><strong>Pro retrained and launched later. Platform lift is still unproven.</strong><p>Same seed, evidence and release limits. Pro improved modeled platform contribution by <b>${usd(pro.deltaUSD-lite.deltaUSD)}</b> versus Flash-Lite. It rejected the weak early model, then retrained and approved a later campaign. No campaign still leads on platform contribution.</p></section><div class="metrics">${[[labels.lite,signed(lite.deltaUSD),'vs no campaign'],[labels.hybrid,signed(pro.deltaUSD),'vs no campaign'],[labels.rules_harness,signed(rules.deltaUSD),'vs no campaign'],['New model usage',usd(r.newCostUSD),r.paidCalls+' generated decisions']].map(([a,b,c])=>`<div class="metric"><small>${a}</small><b>${b}</b><small>${c}</small></div>`).join('')}</div><nav aria-label="Decision day">${r.cases.map((c,i)=>`<button data-day="${i}" aria-selected="${i===0}">Day ${c.day}</button>`).join('')}</nav><div class="flow"><span>Shared investigator evidence</span>→<span>Campaign scientist</span>→<span>Local model</span>→<span>Independent reviewer</span>→<span>Harness + market</span></div><div id="case"></div><h2>100-day campaign outcomes</h2><div class="results"><table><thead><tr><th>Policy</th><th>Platform Δ</th><th>Merchant Δ</th><th>Purchases</th><th>Coupons</th><th>Redeemed</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${labels[x.method]}</td><td>${signed(x.deltaUSD)}</td><td>${signed(x.merchantDeltaUSD)}</td><td>${x.purchases.toLocaleString()}</td><td>${x.coupons}</td><td>${x.redemptions}</td></tr>`).join('')}</tbody></table></div><details><summary>What this comparison proves—and its limits</summary><p>${esc(r.scope)}</p><p>${esc(r.disclosure)}</p><p>New inference cost: $${r.newCostUSD.toFixed(6)}. The shared investigator previously cost $${r.sharedHistoricalAnalystCostUSD.toFixed(6)}; it was not called again. Replaying these outcomes is not another paid run.</p><p>The reviewer's early objection was poor prediction validation. A simple rule checking the same model metric may reproduce that rejection; this does not establish a unique multi-agent advantage.</p><p>${esc(r.budget)}</p></details><footer><b>Channel3:</b> ${r.catalog.map(p=>esc(p.title)+' · '+esc(p.channel3Id)).join(' / ')}<br><b>PayPal:</b> modeled fee and cost accounting; existing sandbox receipts remain separate. This comparison created no payment.<br>Recorded actual Gemini outputs · simulated shoppers · playback makes no model calls.</footer>`;
 function show(i){
  const c=r.cases[i],name=j=>c.merchants.find(m=>m.index===j)?.name||'Merchant '+j;
  document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.day)===i)));
  document.querySelector('#case').innerHTML=`<div class="evidence"><b>What both teams knew · day ${c.day}</b><p>${c.trend.recent} recent purchases versus ${c.trend.previous} previously: ${esc(c.trend.direction.toLowerCase())} by ${Math.abs(c.trend.difference)}. Both received the same dated catalog, merchant limits and mature history.</p></div><div class="teams">${['lite','hybrid'].map(method=>{const x=c.variants[method],p=x.proposal,v=x.review,m=x.model;const action=p.strategy==='observe'?'Observe without outreach':p.strategy==='mixed'?p.maxOfferPct+'% coupon pilot':'Full-price recommendations';return `<article class="team"><h2>${labels[method]}</h2><small>${x.providerModels.map(esc).join(' · ')}</small><div class="role"><b>Campaign scientist proposes</b><div class="choice">${esc(action)}</div><small>${p.merchantIndices.map(name).map(esc).join(' + ')||'No merchants targeted'} · ${esc(p.audience)} shoppers</small><p>${esc(p.rationale)}</p></div><div class="role"><b>Local training evidence</b><p>${m?`Prediction error ${m.mse.toFixed(4)} versus ${m.baselineMse.toFixed(4)} for the constant predictor. ${m.mse<m.baselineMse?'Model is better on this check.':'Model is worse on this check.'}`:'No model fit available.'}</p><small>Prediction accuracy does not prove campaign lift.</small></div><div class="role"><b>Reviewer decides</b><p><span class="status ${v.decision==='reject'?'reject':''}">${esc(v.decision.toUpperCase())}</span></p><p>${esc(v.rationale)}</p></div><div class="role"><b>Executed outcome</b><p>${x.plan.strategy==='observe'?'No promotional outreach. Customers continue shopping.':'Seven-day bounded pilot. At most $5 additional joint promotion spending.'}</p></div></article>`}).join('')}</div>`;
 }
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>show(Number(b.dataset.day)));show(0);
}catch(e){document.querySelector('#content').textContent=e.message;}
</script></body></html>
