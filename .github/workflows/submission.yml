name: Submission checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: submission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m venv .local/marketing-venv && .local/marketing-venv/bin/pip install -r scripts/marketing/requirements.txt
      - run: npm test
      - run: npm run test:judge-simulation
