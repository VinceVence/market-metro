  <g id="text_21">
   <text style="fill: #172c43; font: 22px 'DM Sans'; text-anchor: start" x="7.2" y="23.04" transform="rotate(-0 7.2 23.04)">What our prototype has actually demonstrated</text>
  </g>
  <g id="text_22">
   <text style="fill: #52657a; font: 11px 'DM Sans'; text-anchor: start" x="7.2" y="44.64" transform="rotate(-0 7.2 44.64)">One assistant-planned campaign • local CPU training • no app-hosted LLM or paid model API calls</text>
  </g>
  <g id="text_23">
   <text style="fill: #52657a; font: 10px 'DM Sans'" transform="translate(7.2 400.999687)">The 222 campaign purchases are synthetic. Only 3 selected orders have native sandbox receipts ($139.28 gross; $5.63 fees).</text>
   <text style="fill: #52657a; font: 10px 'DM Sans'" transform="translate(7.2 412.02)">The records establish workflow execution and receipt lineage—not incremental PayPal profit, generalization or individually prevented churn.</text>
  </g>
  <g id="text_24">
   <text style="fill: #52657a; font: 9px 'DM Sans'; text-anchor: start" x="7.2" y="444.78" transform="rotate(-0 7.2 444.78)">Source: docs/campaign-workflow/first-run.json · WF-26c901ed73bed8b1 · simulated outcomes and provider receipts kept separate.</text>
  </g>
