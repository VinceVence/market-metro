   <g id="text_1">
    <text style="fill: #2572b4; font: 700 11px 'DM Sans'; text-anchor: start" x="40.3632" y="110.5606" transform="rotate(-0 40.3632 110.5606)">1. Observe and pin</text>
   </g>
   <g id="text_2">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 131.1984)">Dataset + schema + catalog hashes</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 143.733947)">Window, cutoff, objective, budget</text>
   </g>
   <g id="text_3">
    <text style="fill: #2572b4; font: 700 11px 'DM Sans'; text-anchor: start" x="362.52" y="110.5606" transform="rotate(-0 362.52 110.5606)">2. Analyze and qualify</text>
   </g>
   <g id="text_4">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 131.2459)">Query outputs + model validation</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 143.66715)">Artifact dependencies recorded</text>
   </g>
   <g id="text_5">
    <text style="fill: #16847c; font: 700 11px 'DM Sans'; text-anchor: start" x="684.6768" y="110.5606" transform="rotate(-0 684.6768 110.5606)">3. Commit a campaign</text>
   </g>
   <g id="text_6">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 131.2459)">Revision + eligible cohort + offer</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 143.710197)">Hard checks before activation</text>
   </g>
   <g id="text_7">
    <text style="fill: #be7c28; font: 700 11px 'DM Sans'; text-anchor: start" x="40.3632" y="268.3584" transform="rotate(-0 40.3632 268.3584)">Change or restart</text>
   </g>
   <g id="text_8">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 289.0987)">Compare stored dependencies</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 301.4487)">Mark affected artifacts stale</text>
   </g>
   <g id="text_9">
    <text style="fill: #2572b4; font: 700 11px 'DM Sans'; text-anchor: start" x="362.52" y="268.4134" transform="rotate(-0 362.52 268.4134)">Repair only affected work</text>
   </g>
   <g id="text_10">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 289.0987)">Planner selects the missing check</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 301.562997)">Revalidate before continuation</text>
   </g>
   <g id="text_11">
    <text style="fill: #16847c; font: 700 11px 'DM Sans'; text-anchor: start" x="684.6768" y="268.3584" transform="rotate(-0 684.6768 268.3584)">Record intended effect</text>
   </g>
   <g id="text_12">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 289.0512)">Stable ID + exact payload + key</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 301.47245)">Coupon or selected native order</text>
   </g>
   <g id="text_13">
    <text style="fill: #172c43; font: 700 11px 'DM Sans'; text-anchor: start" x="40.3632" y="442.5958" transform="rotate(-0 40.3632 442.5958)">Immutable history</text>
   </g>
   <g id="text_14">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 463.2811)">Issued coupons stay issued</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 475.6311)">Captured payments stay captured</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(40.3632 488.05235)">Never erase them on replanning</text>
   </g>
   <g id="text_15">
    <text style="fill: #16847c; font: 700 11px 'DM Sans'; text-anchor: start" x="362.52" y="442.5958" transform="rotate(-0 362.52 442.5958)">Verified receipt</text>
   </g>
   <g id="text_16">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 463.2336)">Match ID, amount and currency</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(362.52 475.65485)">Append provider observation</text>
   </g>
   <g id="text_17">
    <text style="fill: #be7c28; font: 700 11px 'DM Sans'; text-anchor: start" x="684.6768" y="443.190487" transform="rotate(-0 684.6768 443.190487)">Dispatch / unknown result</text>
   </g>
   <g id="text_18">
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 463.2811)">Success → verify</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 475.70235)">Timeout → reconcile same identity</text>
    <text style="fill: #172c43; font: 9.5px 'DM Sans'" transform="translate(684.6768 488.1236)">No fresh key to hide uncertainty</text>
   </g>
   <g id="text_19">
    <g id="patch_20">
     <path d="M 441.8248 219.9312 
L 501.1448 219.9312 
