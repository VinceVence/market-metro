    </g>
    <text style="fill: #72869a; font: 8px 'DM Sans'; text-anchor: middle" x="471.4848" y="214.1712" transform="rotate(-0 471.4848 214.1712)">new evidence</text>
   </g>
  </g>
  <g id="text_20">
   <text style="fill: #172c43; font: 23px 'DM Sans'; text-anchor: start" x="17.28" y="23.76" transform="rotate(-0 17.28 23.76)">Resume the work · preserve the effects</text>
  </g>
  <g id="text_21">
   <text style="fill: #52657a; font: 11px 'DM Sans'; text-anchor: start" x="17.28" y="39.6" transform="rotate(-0 17.28 39.6)">Proposed dependency-aware recovery • checkpoint persistence alone cannot establish evidence freshness</text>
  </g>
  <g id="text_22">
   <text style="fill: #52657a; font: 9px 'DM Sans'; text-anchor: start" x="17.28" y="632.52" transform="rotate(-0 17.28 632.52)">PayPal deduplication applies to supported endpoints within their key-retention period. Unknown outcomes may require reconciliation; this is not a universal exactly-once claim.</text>
  </g>
 </g>
